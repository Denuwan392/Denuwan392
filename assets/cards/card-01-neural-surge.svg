<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="100%" stop-color="#10111a"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="800" height="150" rx="12" fill="url(#cardBg1)" stroke="#282a3d" stroke-width="1"/>
  <!-- Number -->
  <text x="38" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#ffffff">01</text>
  <!-- Vertical Divider -->
  <line x1="74" y1="24" x2="74" y2="126" stroke="#26283d" stroke-width="1"/>
  <!-- Category -->
  <text x="94" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#6b6e85">AGENTIC AI</text>
  <!-- GitHub Link Indicator -->
  <text x="766" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#8b8ea8">GitHub ↗</text>
  <!-- Project Title -->
  <text x="94" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Neural Surge</text>
  <!-- Description -->
  <text x="94" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9ba0b8">Multi-agent system for autonomous task planning, reasoning, and orchestration.</text>
  <text x="94" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9ba0b8">Engineered with LangGraph state machines, RAG retrieval loops, and full observability.</text>
  <!-- Tech Pills -->
  <g transform="translate(94, 118)">
    <rect x="0" y="0" width="56" height="20" rx="5" fill="#1f2130" stroke="#2e3146" stroke-width="0.8"/>
    <text x="28" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a5a9c0">Python</text>
    <rect x="62" y="0" width="76" height="20" rx="5" fill="#1f2130" stroke="#2e3146" stroke-width="0.8"/>
    <text x="100" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a5a9c0">LangGraph</text>
    <rect x="144" y="0" width="60" height="20" rx="5" fill="#1f2130" stroke="#2e3146" stroke-width="0.8"/>
    <text x="174" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a5a9c0">Gemini</text>
    <rect x="210" y="0" width="58" height="20" rx="5" fill="#1f2130" stroke="#2e3146" stroke-width="0.8"/>
    <text x="239" y="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a5a9c0">Qdrant</text>
  </g>
</svg>
